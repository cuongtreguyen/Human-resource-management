version: '3.8'

services:
  # PostgreSQL Database (optional - nếu muốn chạy local thay vì Railway)
  postgres:
    image: postgres:15-alpine
    container_name: hrm-postgres
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: VrcVwxWXCzPyelOzQYpbTDXCcCQJJDXu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrm-network
    # Uncomment nếu muốn dùng database local
    # profiles:
    #   - local-db

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrm-backend
    ports:
      - "8085:8085"
    environment:
      # Database Configuration (nếu dùng PostgreSQL trong Docker)
      # SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/railway
      # SPRING_DATASOURCE_USERNAME: postgres
      # SPRING_DATASOURCE_PASSWORD: VrcVwxWXCzPyelOzQYpbTDXCcCQJJDXu
      
      # Hoặc dùng Railway database (như hiện tại)
      SPRING_DATASOURCE_URL: jdbc:postgresql://caboose.proxy.rlwy.net:54977/railway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: VrcVwxWXCzPyelOzQYpbTDXCcCQJJDXu
      
      # Server Port
      PORT: 8085
      
      # AWS Configuration (nên dùng environment variables thay vì hardcode)
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-AKIAT3H4A6RPRDS2XKXT}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-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}
      AWS_SECRETS_JWT_SECRET_NAME: prod/HRM
      
      # Flask API (Flask chạy trên host machine, dùng host.docker.internal để truy cập từ container)
      FLASK_API_BASE_URL: http://host.docker.internal:5000
      
      # JWT Configuration
      SECURITY_JWT_ISSUER: hrm-system
      SECURITY_JWT_ACCESS_TOKEN_TTL: 3600
      SECURITY_JWT_REFRESH_TOKEN_TTL: 86400
      
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_MANAGEMENT_MEMBER_DEMO: DEBUG
    # depends_on:
    #   - postgres  # Uncomment nếu dùng PostgreSQL trong Docker
    networks:
      - hrm-network
    restart: unless-stopped
    # Health check (uncomment nếu có Spring Actuator)
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  # Flask API (optional - nếu muốn chạy Flask trong Docker)
  # flask-api:
  #   build:
  #     context: ../FlaskAPI  # Đường dẫn đến Flask project
  #     dockerfile: Dockerfile
  #   container_name: hrm-flask-api
  #   ports:
  #     - "5000:5000"
  #   networks:
  #     - hrm-network
  #   restart: unless-stopped

networks:
  hrm-network:
    driver: bridge

volumes:
  postgres_data:

