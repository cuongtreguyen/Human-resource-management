version: '3.9'
services:
  face-recognition-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face-recognition-api
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      # Java API
      JAVA_API_URL: ${JAVA_API_URL:-http://host.docker.internal:8085}
      FLASK_ENV: ${FLASK_ENV:-production}   # production mode
      FLASK_DEBUG: ${FLASK_DEBUG:-False}    # tắt debug khi production
      
      # AWS S3 Configuration
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.ap-southeast-1.amazonaws.com}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-face-recognition-backend}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
    restart: unless-stopped
    networks:
      - face-recognition-network

  postgres:
    image: postgis/postgis:17-3.5
    container_name: anou-postgres
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: VrcVwxWXCzPyelOzQYpbTDXCcCQJJDXu
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: anou-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:

networks:
  face-recognition-network:
    driver: bridge
