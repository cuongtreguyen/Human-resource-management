services:
  # PostgreSQL Database (optional - nếu muốn chạy local thay vì Railway)
  postgres:
    image: postgres:15-alpine
    container_name: hrm-postgres
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: VrcVwxWXCzPyelOzQYpbTDXCcCQJJDXu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrm-network
    # Uncomment nếu muốn dùng database local
    # profiles:
    #   - local-db

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrm-backend
    ports:
      - "8085:8085"
    environment:
      # Database Configuration (nếu dùng PostgreSQL trong Docker)
      # SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/railway
      # SPRING_DATASOURCE_USERNAME: postgres
      # SPRING_DATASOURCE_PASSWORD: VrcVwxWXCzPyelOzQYpbTDXCcCQJJDXu
      
      # Hoặc dùng Railway database (như hiện tại)
      SPRING_DATASOURCE_URL: jdbc:postgresql://caboose.proxy.rlwy.net:54977/railway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: VrcVwxWXCzPyelOzQYpbTDXCcCQJJDXu
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      
      # Server Port
      PORT: 8085
      
      # AWS Configuration (nên dùng environment variables thay vì hardcode)
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-AKIAT3H4A6RPRDS2XKXT}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-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}
      AWS_SECRETS_JWT_SECRET_NAME: prod/HRM
      
      # Flask API (Flask chạy trên host machine, dùng host.docker.internal để truy cập từ container)
      FLASK_API_BASE_URL: http://host.docker.internal:5000
      
      # AWS S3 Configuration
      AWS_S3_BUCKET_NAME: hrm-attachments
      
      # JWT Configuration
      SECURITY_JWT_ISSUER: hrm-system
      SECURITY_JWT_ACCESS_TOKEN_TTL: 3600
      SECURITY_JWT_REFRESH_TOKEN_TTL: 86400
      
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_MANAGEMENT_MEMBER_DEMO: DEBUG
    # depends_on:
    #   - postgres  # Uncomment nếu dùng PostgreSQL trong Docker
    networks:
      - hrm-network
    restart: unless-stopped
    # Health check (uncomment nếu có Spring Actuator)
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  # Kafka & Zookeeper (OPTIONAL - chỉ cần nếu muốn dùng Kafka cho audit logging)
  # Hiện tại AuditLogService chỉ dùng JPA repository, không dùng Kafka
  # Uncomment nếu muốn tích hợp Kafka trong tương lai
  # kafka:
  #   image: confluentinc/cp-kafka:7.5.0
  #   container_name: hrm-kafka
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  #     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  #   volumes:
  #     - kafka_data:/var/lib/kafka/data
  #   depends_on:
  #     - zookeeper
  #   networks:
  #     - hrm-network
  #   restart: unless-stopped
  #
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.5.0
  #   container_name: hrm-zookeeper
  #   ports:
  #     - "2181:2181"
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #     ZOOKEEPER_TICK_TIME: 2000
  #   volumes:
  #     - zookeeper_data:/var/lib/zookeeper/data
  #   networks:
  #     - hrm-network
  #   restart: unless-stopped

  # OpenTelemetry Collector (OPTIONAL - chỉ cần nếu muốn monitoring)
  # Hiện tại không có service nào sử dụng OpenTelemetry Tracer
  # Uncomment nếu muốn tích hợp monitoring trong tương lai
  # otel-collector:
  #   image: otel/opentelemetry-collector:latest
  #   container_name: hrm-otel-collector
  #   command: ["--config=/etc/otel-collector-config.yaml"]
  #   volumes:
  #     - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
  #   ports:
  #     - "4317:4317"
  #     - "4318:4318"
  #   networks:
  #     - hrm-network
  #   restart: unless-stopped
  #   profiles:
  #     - monitoring

  # Flask API (optional - nếu muốn chạy Flask trong Docker)
  # flask-api:
  #   build:
  #     context: ../FlaskAPI  # Đường dẫn đến Flask project
  #     dockerfile: Dockerfile
  #   container_name: hrm-flask-api
  #   ports:
  #     - "5000:5000"
  #   networks:
  #     - hrm-network
  #   restart: unless-stopped

networks:
  hrm-network:
    driver: bridge

volumes:
  postgres_data:
  # kafka_data:  # Uncomment nếu dùng Kafka
  # zookeeper_data:  # Uncomment nếu dùng Zookeeper

